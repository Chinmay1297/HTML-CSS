<canvas id="life" width="500" height="500"></canvas>
<script>
    let screenSize = 500;
    m = document.getElementById("life").getContext('2d');
    draw = (x, y, c, s) => {
        m.fillStyle = c
        m.fillRect(x, y, s, s)
    }

    particles = []
    particle = (x, y, c) => {
        //Position x,y
        //velocity vx,vy
        //color c
        return { "x": x, "y": y, "vx": 0, "vy": 0, "color": c }
    }

    random = () => {
        return Math.random() * (screenSize - 80) + 50;
    }

    create = (number, color) => {
        group = []
        for (let i = 0; i < number; i++) {
            group.push(particle(random(), random(), color))
            particles.push(group[i]);
        }
        return group;
    }

    rule = (particles1, particles2, g) => {
        for (let i = 0; i < particles1.length; i++) {
            fx = 0;
            fy = 0
            for (let j = 0; j < particles2.length; j++) {
                a = particles1[i]
                b = particles2[j]
                dx = a.x - b.x;
                dy = a.y - b.y;
                d = Math.sqrt((dx * dx) + (dy * dy));  //using pythagoreas theorem
                if (d > 0 && d < 80) {
                    F = g * 1 / d;     //f = g * (m1 x m2)/d^2   gravity rule
                    fx += (F * dx);
                    fy += (F * dy);
                }


            }
            //adding velocity
            a.vx = (a.vx + fx) * 0.5;   //0.5 is multiplied to reduce velocity
            a.vy = (a.vy + fy) * 0.5;
            a.x += a.vx;
            a.y += a.vy;
            //rebound/(reverse direction) when going out of bounds
            if (a.x <= 0 || a.x >= screenSize) { a.vx *= -1 }
            if (a.y <= 0 || a.y >= screenSize) { a.vy *= -1 }
        }

    }
    function getRandomFloatWithMaintainedRange() {
        const randomValues = Array.from({ length: 5 }, () => Math.random() * 2 - 1);
        return randomValues.reduce((acc, val) => acc + val, 0) / randomValues.length;
    }


    let noOfParticles = 300;

    yellow = create(2000, "yellow");
    red = create(400, "red");
    green = create(500, "green");
    update = () => {
        //-ve g attract
        //+ve g repel
        rule(yellow, red, getRandomFloatWithMaintainedRange());
        rule(red, red, getRandomFloatWithMaintainedRange());
        rule(green, green, getRandomFloatWithMaintainedRange());
        rule(red, yellow, getRandomFloatWithMaintainedRange());
        rule(red, green, getRandomFloatWithMaintainedRange());
        rule(green, red, getRandomFloatWithMaintainedRange());
        rule(yellow, green, getRandomFloatWithMaintainedRange());
        rule(green, yellow, getRandomFloatWithMaintainedRange());
        m.clearRect(0, 0, screenSize, screenSize)
        draw(0, 0, "black", screenSize)
        for (i = 0; i < particles.length; i++) {
            draw(particles[i].x, particles[i].y, particles[i].color, 2);
        }
        requestAnimationFrame(update);
    }

    update();
</script>
