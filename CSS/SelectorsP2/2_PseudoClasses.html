<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button:hover {
            background-color: blueviolet;
            color: antiquewhite;
            border-radius: 25px;
        }

        button:active {
            background-color: chocolate;
        }

        input:disabled {
            border-radius: 10px;
        }

        :not(h1, h2) {
            /* Selects everything that is not <h1>, <h2> */
            font-style: italic;
        }
    </style>
</head>

<body>
    <h1>Pseudo Classes</h1>
    <p>We can specify a particular state of an element and select it. Ex: hover, active, focus, etc</p>
    <input type="text" disabled placeholder="This input is disabled">
    <button>Submit</button>


</body>

</html>
